# Thanks to: https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Use xterm keymapping
set -g xterm-keys on

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# copy mode
setw -g mode-style 'fg=black bg=gray bold'

# panes
set -g pane-border-lines single
set -g pane-border-style "fg=#3b4244"
set -g pane-active-border-style "fg=#67b0e8"

# statusbar
set -g status-position bottom
set -g status-justify right
set -g status-style 'fg=blue'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=blue'
set -g status-right ''
set -g status-right-length 50

setw -g window-status-current-style 'fg=cyan bg=black'
set -g window-status-current-format "#[fg=black,bg=cyan] #I #W #[fg=cyan,bg=default]"

setw -g window-status-style 'fg=blue bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=cyan]#F '

setw -g window-status-bell-style 'fg=cyan bg=blue bold'

# messages
set -g message-style 'fg=cyan bg=blue bold'