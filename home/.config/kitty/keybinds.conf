# ==============================================================================
# Layouts
# ==============================================================================
# Enable layouts (splits is primary, stack acts as a zoom toggle)
enabled_layouts splits,stack

# Zoom current window (toggle between full-screen stack and splits view)
map f1 toggle_layout stack

# Create splits in the current working directory
map ctrl+shift+- launch --cwd=current --location=hsplit
map ctrl+shift+\ launch --cwd=current --location=vsplit

# ==============================================================================
# Window Navigation & Swapping (Master / Stack)
# ==============================================================================
# Move focus directionally
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Directional window swapping (shift windows around the split grid)
map ctrl+shift+left  move_window left
map ctrl+shift+right move_window right
map ctrl+shift+up    move_window up
map ctrl+shift+down  move_window down

# Quick swap: promote/swap active window with master/previous slot
map ctrl+shift+m swap_with_window

# ==============================================================================
# Font Size Controls
# ==============================================================================
# Cleaned key combinations without invisible non-breaking spaces
map ctrl+shift+equal     change_font_size all +2.0
map ctrl+shift+plus      change_font_size all +2.0
map ctrl+minus           change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0